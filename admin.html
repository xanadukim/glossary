<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>관리자 - glossary</title>
  <link rel="stylesheet" href="./css/app.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { --bg:#fff; --surface:#fff; --surface-2:#f5f5f5; --border:#e5e7eb; }
    body { background:var(--bg); }
  </style>
  <script type="importmap">{"imports":{"xlsx":"https://esm.sh/xlsx@0.18.5","@supabase/supabase-js":"https://esm.sh/@supabase/supabase-js@2.45.4"}}</script>
</head>
<body>
<div id="root"></div>
<script type="module">
import { supabase } from './js/supabase.js';
import { loadTerms, normalizeTerm } from './js/loader.js';
import { exportAllTerms, exportFavorites, importFromExcel, generateCSVFromTerms } from './js/export.js';
import { CATEGORIES, getCategoryColor, LOCAL_STORAGE_KEYS } from './js/config.js';

let allTerms = [];
let filtered = [];
let searchQuery = '';
let editingId = null; // 수정 중인 id
let isCustomCategory = false;

async function checkAuth() {
  const { data } = await supabase.auth.getSession();
  return !!data.session;
}

function validateId(id, isEdit=false) {
  if (!id) return 'id는 필수입니다.';
  if (!/^[a-z0-9-]+$/.test(id)) return 'id는 영문 소문자, 숫자, 하이픈(-)만 허용됩니다.';
  if (!isEdit) {
    const dup = allTerms.some(t => t.id.toLowerCase() === id.toLowerCase());
    if (dup) return `이미 존재하는 id입니다: ${id} (중복 불가, 키필드)`;
  }
  return null;
}

function renderLogin() {
  const root = document.getElementById('root');
  root.innerHTML = `
    <div class="min-h-screen grid place-items-center px-4 bg-zinc-50">
      <div class="w-full max-w-[400px] rounded-[24px] border bg-white p-8 shadow-sm">
        <div class="h-10 w-10 rounded-xl bg-black text-white grid place-items-center font-bold mb-4">IT</div>
        <h1 class="text-[20px] font-extrabold">glossary 관리자 로그인</h1>
        <p class="text-[13px] text-zinc-500 mt-1">Supabase Auth로 로그인해야 CRUD가 가능합니다. RLS 정책이 적용됩니다.</p>
        <div class="mt-6 space-y-3">
          <input id="email" type="email" placeholder="admin@glossary.local" class="w-full h-11 px-4 rounded-full border bg-zinc-50 outline-none text-[14px]" />
          <input id="password" type="password" placeholder="비밀번호" class="w-full h-11 px-4 rounded-full border bg-zinc-50 outline-none text-[14px]" />
          <button id="loginBtn" class="w-full h-11 rounded-full bg-black text-white font-semibold">로그인</button>
          <a href="./index.html" class="block text-center text-[12px] text-zinc-400 underline">← 대시보드로 돌아가기</a>
          <div id="loginMsg" class="text-[12px] text-red-500 min-h-[18px]"></div>
          <div class="text-[11px] text-zinc-400 p-3 bg-zinc-50 rounded-xl">초보자용: Supabase Dashboard > Authentication > Users 에서 만든 이메일/비번을 입력하세요. 이전 ai1283 해시 방식은 삭제되었습니다.</div>
        </div>
      </div>
    </div>
  `;
  document.getElementById('loginBtn').onclick = async () => {
    const email = document.getElementById('email').value.trim();
    const pw = document.getElementById('password').value;
    const msg = document.getElementById('loginMsg');
    if (!email || !pw) { msg.textContent = '이메일과 비밀번호를 입력하세요.'; return; }
    msg.textContent = '로그인 중...';
    try {
      const { error } = await supabase.auth.signInWithPassword({ email, password: pw });
      if (error) throw error;
      renderAdmin();
    } catch (e) {
      msg.textContent = '로그인 실패: ' + e.message;
    }
  };
  document.getElementById('password').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('loginBtn').click(); });
}

async function renderAdmin() {
  try {
    const { allTerms: loaded } = await loadTerms();
    allTerms = loaded;
  } catch {}
  filtered = [...allTerms];
  const root = document.getElementById('root');
  const { data: { user } } = await supabase.auth.getUser();

  root.innerHTML = `
    <header class="sticky top-0 z-20 border-b bg-white/90 backdrop-blur-xl">
      <div class="mx-auto max-w-[1400px] px-6 h-[64px] flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="h-9 w-9 rounded-xl bg-black text-white grid place-items-center font-bold">IT</div>
          <div>
            <div class="font-extrabold">glossary 관리자</div>
            <div class="text-[11px] text-zinc-500">${user?.email} · Supabase · ${allTerms.length}개 · id 중복 불가 (키필드)</div>
          </div>
        </div>
        <div class="flex gap-2">
          <a href="./index.html" class="h-9 px-4 rounded-full border bg-zinc-50 grid place-items-center text-[13px]">대시보드</a>
          <button id="logoutBtn" class="h-9 px-4 rounded-full border bg-zinc-50 text-[13px]">로그아웃</button>
        </div>
      </div>
    </header>

    <main class="mx-auto max-w-[1400px] px-6 py-6 grid lg:grid-cols-[380px_1fr] gap-6">
      <!-- LEFT: CRUD 폼 -->
      <div class="space-y-4">
        <div class="rounded-[20px] border bg-white p-5">
          <div class="flex justify-between items-center">
            <h2 class="font-bold text-[15px]">${editingId ? '용어 수정' : '신규 용어 추가 (Create)'}</h2>
            ${editingId ? `<button id="cancelEdit" class="text-[12px] underline text-zinc-500">취소</button>` : ''}
          </div>
          <p class="text-[11px] text-zinc-500 mt-1">id는 키필드, 중복 불가. category는 직접 입력 허용.</p>
          <div class="mt-4 space-y-3">
            <div>
              <label class="text-[11px] font-bold text-zinc-600">id * (키필드, 중복 불가)</label>
              <input id="f-id" placeholder="예: crud, react-hooks" class="mt-1 w-full h-10 px-3 rounded-xl border bg-zinc-50 text-[13px] mono" ${editingId ? 'readonly' : ''} />
              <div id="f-id-msg" class="text-[11px] text-red-500 mt-1"></div>
            </div>
            <div>
              <label class="text-[11px] font-bold">term *</label>
              <input id="f-term" class="mt-1 w-full h-10 px-3 rounded-xl border text-[13px]" />
            </div>
            <div>
              <label class="text-[11px] font-bold">fullname</label>
              <input id="f-fullname" class="mt-1 w-full h-10 px-3 rounded-xl border text-[13px]" />
            </div>
            <div>
              <label class="text-[11px] font-bold">meaning *</label>
              <textarea id="f-meaning" rows="3" class="mt-1 w-full p-3 rounded-xl border text-[13px]"></textarea>
            </div>
            <div>
              <label class="text-[11px] font-bold">example</label>
              <textarea id="f-example" rows="2" class="mt-1 w-full p-3 rounded-xl border text-[13px]"></textarea>
            </div>
            <div>
              <label class="text-[11px] font-bold">category * (직접 입력 허용)</label>
              <select id="f-category-select" class="mt-1 w-full h-10 px-3 rounded-xl border text-[13px]">
                ${CATEGORIES.map(c=>`<option value="${c}">${c}</option>`).join('')}
                <option value="__custom__">+ 직접 입력</option>
              </select>
              <input id="f-category-custom" placeholder="신규 카테고리 직접 입력" class="mt-2 w-full h-10 px-3 rounded-xl border bg-amber-50 text-[13px] hidden" />
            </div>
            <div>
              <label class="text-[11px] font-bold">longDesc</label>
              <textarea id="f-longdesc" rows="2" class="mt-1 w-full p-3 rounded-xl border text-[12px]"></textarea>
            </div>
            <div>
              <label class="text-[11px] font-bold">defaultFav</label>
              <input id="f-defaultfav" placeholder="true 또는 비우기" class="mt-1 w-full h-10 px-3 rounded-xl border text-[13px]" />
            </div>
            <button id="saveBtn" class="w-full h-11 rounded-full bg-black text-white font-semibold">${editingId ? '수정 저장 (Update)' : '추가 (Create)'}</button>
            <div id="formMsg" class="text-[12px] min-h-[18px]"></div>
          </div>
        </div>

        <div class="rounded-[20px] border bg-white p-5">
          <h3 class="font-bold text-[14px]">데이터 처리 방식 (Supabase)</h3>
          <div class="text-[12px] text-zinc-600 mt-2 leading-relaxed space-y-2">
            <p><b>1. 즉시 반영:</b> Create/Update/Delete 시 Supabase에 바로 저장됩니다. CSV 다운로드 후 GitHub 교체 과정 불필요.</p>
            <p><b>2. id:</b> PK, 중복 불가. 클라이언트에서 먼저 중복 체크, DB에서도 PK 제약으로 2차 방어.</p>
            <p><b>3. category:</b> 기존 12개 외 직접 입력 허용. 새로 입력된 카테고리는 자동으로 회색 dot으로 표시되며, config.js에 색상 추가 가능.</p>
            <p><b>4. Fallback:</b> Supabase 장애 시 index.html은 terms.csv를 자동 로드.</p>
          </div>
          <div class="mt-4 grid grid-cols-2 gap-2">
            <button id="exportAllBtn" class="h-9 rounded-full border text-[12px]">전체 엑셀 다운로드</button>
            <button id="exportCsvBtn" class="h-9 rounded-full border text-[12px]">CSV 백업 다운로드</button>
          </div>
        </div>
      </div>

      <!-- RIGHT: 테이블 -->
      <div class="rounded-[20px] border bg-white p-5 min-w-0">
        <div class="flex flex-col sm:flex-row gap-3 justify-between items-start sm:items-center">
          <h2 class="font-bold">용어 목록 (Read) · ${allTerms.length}개</h2>
          <input id="searchInput" placeholder="id, term, meaning 검색" class="h-10 px-4 rounded-full border bg-zinc-50 text-[13px] w-full sm:w-[260px]" />
        </div>
        <div class="mt-4 overflow-auto max-h-[80vh] border rounded-xl">
          <table class="w-full text-[12px]">
            <thead class="sticky top-0 bg-zinc-50 border-b">
              <tr><th class="p-2.5 text-left">id (키)</th><th class="p-2.5 text-left">term</th><th class="p-2.5 text-left">category</th><th class="p-2.5 text-left">meaning</th><th class="p-2.5 text-right">액션</th></tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <div id="tableMsg" class="mt-3 text-[11px] text-zinc-500"></div>
      </div>
    </main>
  `;

  document.getElementById('logoutBtn').onclick = async () => { await supabase.auth.signOut(); renderLogin(); };
  document.getElementById('exportAllBtn').onclick = () => exportAllTerms(allTerms);
  document.getElementById('exportCsvBtn').onclick = () => {
    const csv = generateCSVFromTerms(allTerms);
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'terms.csv'; a.click();
  };

  // category 직접 입력 로직
  const sel = document.getElementById('f-category-select');
  const customInput = document.getElementById('f-category-custom');
  sel.addEventListener('change', () => {
    if (sel.value === '__custom__') { customInput.classList.remove('hidden'); customInput.focus(); isCustomCategory = true; }
    else { customInput.classList.add('hidden'); isCustomCategory = false; }
  });

  function getCategoryValue() {
    if (sel.value === '__custom__') return customInput.value.trim();
    return sel.value;
  }

  function fillForm(t) {
    document.getElementById('f-id').value = t.id;
    document.getElementById('f-term').value = t.term;
    document.getElementById('f-fullname').value = t.fullname || '';
    document.getElementById('f-meaning').value = t.meaning || '';
    document.getElementById('f-example').value = t.example || '';
    document.getElementById('f-longdesc').value = t.longDesc || t.longdesc || '';
    document.getElementById('f-defaultfav').value = t.defaultFav || t.defaultfav || '';
    // category
    if (CATEGORIES.includes(t.category)) { sel.value = t.category; customInput.classList.add('hidden'); isCustomCategory=false; }
    else { sel.value='__custom__'; customInput.classList.remove('hidden'); customInput.value=t.category; isCustomCategory=true; }
  }

  function clearForm() {
    editingId = null;
    document.getElementById('f-id').value=''; document.getElementById('f-id').readOnly=false;
    document.getElementById('f-term').value=''; document.getElementById('f-fullname').value='';
    document.getElementById('f-meaning').value=''; document.getElementById('f-example').value='';
    document.getElementById('f-longdesc').value=''; document.getElementById('f-defaultfav').value='';
    sel.value=CATEGORIES[0]; customInput.classList.add('hidden'); customInput.value=''; isCustomCategory=false;
    document.getElementById('f-id-msg').textContent=''; document.getElementById('formMsg').textContent='';
    // render again to update title
    renderAdmin();
  }

  document.getElementById('cancelEdit')?.addEventListener('click', clearForm);

  document.getElementById('saveBtn').onclick = async () => {
    const id = document.getElementById('f-id').value.trim().toLowerCase();
    const term = document.getElementById('f-term').value.trim();
    const fullname = document.getElementById('f-fullname').value.trim();
    const meaning = document.getElementById('f-meaning').value.trim();
    const example = document.getElementById('f-example').value.trim();
    const category = getCategoryValue();
    const longDesc = document.getElementById('f-longdesc').value.trim();
    const defaultFav = document.getElementById('f-defaultfav').value.trim();
    const msgEl = document.getElementById('formMsg');
    const idMsg = document.getElementById('f-id-msg');

    if (!term || !meaning || !category) { msgEl.textContent='term, meaning, category는 필수입니다.'; msgEl.className='text-[12px] text-red-500'; return; }
    const idErr = validateId(id, !!editingId);
    if (idErr) { idMsg.textContent=idErr; return; } else idMsg.textContent='';

    const payload = { id, term, fullname, meaning, example, category, longDesc, defaultFav };

    msgEl.textContent='저장 중...'; msgEl.className='text-[12px] text-zinc-500';
    try {
      if (editingId) {
        // Update: id는 변경 불가
        const { error } = await supabase.from('terms').update(payload).eq('id', editingId);
        if (error) throw error;
        msgEl.textContent=`수정 완료: ${id}`; msgEl.className='text-[12px] text-green-600';
      } else {
        const { error } = await supabase.from('terms').insert(payload);
        if (error) throw error;
        msgEl.textContent=`추가 완료: ${id}`; msgEl.className='text-[12px] text-green-600';
      }
      // reload
      const { allTerms: reloaded } = await loadTerms();
      allTerms = reloaded; filtered = [...allTerms]; renderTable();
      if (!editingId) document.getElementById('f-id').value='';
    } catch (e) {
      msgEl.textContent='저장 실패: '+e.message; msgEl.className='text-[12px] text-red-500';
      if (e.message.includes('duplicate') || e.message.includes('_pkey')) {
        idMsg.textContent='DB에서도 중복 감지: 이미 존재하는 id입니다.';
      }
    }
  };

  function renderTable() {
    const tbody = document.getElementById('tbody');
    const q = searchQuery.toLowerCase();
    filtered = allTerms.filter(t => {
      if (!q) return true;
      return `${t.id} ${t.term} ${t.meaning} ${t.category}`.toLowerCase().includes(q);
    });
    tbody.innerHTML = filtered.map(t => `
      <tr class="border-t hover:bg-zinc-50">
        <td class="p-2.5 mono text-[11px] font-bold">${t.id}</td>
        <td class="p-2.5 font-semibold">${t.term}</td>
        <td class="p-2.5"><span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full border text-[11px]" style="border-color:${getCategoryColor(t.category)}20"><span class="h-1.5 w-1.5 rounded-full" style="background:${getCategoryColor(t.category)}"></span>${t.category}</span></td>
        <td class="p-2.5 max-w-[260px] truncate">${t.meaning}</td>
        <td class="p-2.5 text-right">
          <div class="inline-flex gap-1">
            <button data-edit="${t.id}" class="edit-btn h-7 px-2.5 rounded-full border bg-white text-[11px]">수정</button>
            <button data-del="${t.id}" class="del-btn h-7 px-2.5 rounded-full border bg-red-50 text-red-600 text-[11px]">삭제</button>
          </div>
        </td>
      </tr>
    `).join('');
    document.getElementById('tableMsg').textContent = `${filtered.length} / ${allTerms.length} 표시 · id는 PK, 중복 불가 · category 직접 입력 허용`;
    document.querySelectorAll('.edit-btn').forEach(b => {
      b.onclick = () => {
        const t = allTerms.find(x=>x.id===b.dataset.edit);
        if (!t) return;
        editingId = t.id;
        fillForm(t);
        window.scrollTo({ top:0, behavior:'smooth' });
        // 제목 변경을 위해 상단 폼 영역 다시 렌더 없이 값만 유지, 버튼 텍스트 변경
        document.querySelector('h2').textContent = '용어 수정';
      };
    });
    document.querySelectorAll('.del-btn').forEach(b => {
      b.onclick = async () => {
        const id = b.dataset.del;
        if (!confirm(`정말 삭제할까요? id=${id} (되돌릴 수 없음)`)) return;
        try {
          const { error } = await supabase.from('terms').delete().eq('id', id);
          if (error) throw error;
          allTerms = allTerms.filter(x=>x.id!==id);
          renderTable();
        } catch (e) { alert('삭제 실패: '+e.message); }
      };
    });
  }

  document.getElementById('searchInput').addEventListener('input', e=>{ searchQuery=e.target.value; renderTable(); });

  // 초기 폼이 비어있으면 id 자동 생성 힌트
  document.getElementById('f-term').addEventListener('blur', () => {
    const idInput = document.getElementById('f-id');
    if (editingId) return;
    if (idInput.value) return;
    const term = document.getElementById('f-term').value.trim().toLowerCase();
    if (!term) return;
    const gen = term.replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40);
    idInput.value = gen;
  });

  renderTable();
}

(async () => {
  if (await checkAuth()) renderAdmin();
  else renderLogin();
  supabase.auth.onAuthStateChange((event) => {
    if (event==='SIGNED_OUT') renderLogin();
  });
})();
</script>
</body>
</html>
