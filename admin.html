<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>관리자 - glossary (Tier3 자동화)</title>
  <link rel="stylesheet" href="./css/app.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
  <style>
    :root { --bg:#f8f9fb; --surface:#fff; --surface-2:#f1f3f5; --border:#e6e8eb; }
    body { background:var(--bg); font-family:'Pretendard Variable', Pretendard, ui-sans-serif,system-ui,sans-serif; letter-spacing: -0.01em; -webkit-font-smoothing: antialiased; }
    .mono { font-family:ui-monospace,monospace; }
    /* Admin compact: smaller fonts, larger shapes */
    input, select, textarea { font-size: 12px !important; border-radius: 14px !important; }
    button { font-size: 12px !important; border-radius: 9999px !important; }
    table { font-size: 11px !important; }
    /* Larger shapes */
    .rounded-\[20px\] { border-radius: 20px !important; }
    .rounded-\[24px\] { border-radius: 24px !important; }
    .h-9 { height: 36px !important; }
    .h-10 { height: 40px !important; }
    .h-11 { height: 44px !important; }
  </style>
  <script type="importmap">{"imports":{"xlsx":"https://esm.sh/xlsx@0.18.5","@supabase/supabase-js":"https://esm.sh/@supabase/supabase-js@2.45.4"}}</script>
</head>
<body>
<div id="root"></div>
<script type="module">
import { supabase } from './js/supabase.js';
import { loadTerms, normalizeTerm } from './js/loader.js';
import { exportAllTerms, generateCSVFromTerms } from './js/export.js';
import { CATEGORIES, CATEGORY_COLORS, getCategoryColor } from './js/config.js';

let allTerms = [];
let filtered = [];
let searchQuery = '';
let editingId = null;
let isCustomCategory = false;
let currentTab = 'crud'; // crud | automation | pending
let automationSettings = null;
let pendingTerms = [];
let pendingFilter = '';

async function checkAuth() {
  const { data } = await supabase.auth.getSession();
  return !!data.session;
}

function validateId(id, isEdit=false) {
  if (!id) return 'id는 필수입니다.';
  if (!/^[a-z0-9-]+$/.test(id)) return 'id는 영문 소문자, 숫자, 하이픈(-)만 허용됩니다.';
  if (!isEdit) {
    const dup = allTerms.some(t => t.id.toLowerCase() === id.toLowerCase());
    if (dup) return `이미 존재하는 id입니다: ${id} (중복 불가, 키필드)`;
    const dupPending = pendingTerms.some(t => t.id.toLowerCase() === id.toLowerCase());
    if (dupPending) return `Pending에 이미 존재: ${id}`;
  }
  return null;
}

function renderLogin() {
  const root = document.getElementById('root');
  root.innerHTML = `
    <div class="min-h-screen grid place-items-center px-4 bg-zinc-50">
      <div class="w-full max-w-[400px] rounded-[24px] border bg-white p-8 shadow-sm">
        <div class="h-10 w-10 rounded-xl bg-black text-white grid place-items-center font-bold mb-4">IT</div>
        <h1 class="text-[20px] font-extrabold">glossary 관리자 로그인</h1>
        <p class="text-[13px] text-zinc-500 mt-1">Supabase Auth 로그인 후 Tier3 자동화 사용 가능</p>
        <div class="mt-6 space-y-3">
          <input id="email" type="email" placeholder="admin@glossary.local" class="w-full h-11 px-4 rounded-full border bg-zinc-50 outline-none text-[14px]" />
          <input id="password" type="password" placeholder="비밀번호" class="w-full h-11 px-4 rounded-full border bg-zinc-50 outline-none text-[14px]" />
          <button id="loginBtn" class="w-full h-11 rounded-full bg-black text-white font-semibold">로그인</button>
          <a href="./index.html" class="block text-center text-[12px] text-zinc-400 underline">← 대시보드로 돌아가기</a>
          <div id="loginMsg" class="text-[12px] text-red-500 min-h-[18px]"></div>
        </div>
      </div>
    </div>
  `;
  document.getElementById('loginBtn').onclick = async () => {
    const email = document.getElementById('email').value.trim();
    const pw = document.getElementById('password').value;
    const msg = document.getElementById('loginMsg');
    if (!email || !pw) { msg.textContent = '이메일과 비밀번호를 입력하세요.'; return; }
    msg.textContent = '로그인 중...';
    try {
      const { error } = await supabase.auth.signInWithPassword({ email, password: pw });
      if (error) throw error;
      renderAdmin();
    } catch (e) { msg.textContent = '로그인 실패: ' + e.message; }
  };
}

async function loadAutomationSettings() {
  try {
    const { data, error } = await supabase.from('automation_settings').select('*').order('created_at', { ascending: false }).limit(1).single();
    if (error && error.code !== 'PGRST116') throw error;
    automationSettings = data || { selected_categories: null, schedule_type: 'weekly', weekly_count: 5, enabled: true };
  } catch {
    automationSettings = { selected_categories: null, schedule_type: 'weekly', weekly_count: 5, enabled: true };
  }
}

async function loadPendingTerms() {
  try {
    const { data, error } = await supabase.from('terms_pending').select('*').eq('status','pending').order('created_at', { ascending: false }).limit(100);
    if (error) throw error;
    pendingTerms = data || [];
  } catch (e) {
    console.error('pending load failed', e);
    pendingTerms = [];
  }
}

async function renderAdmin() {
  try {
    const { allTerms: loaded } = await loadTerms();
    allTerms = loaded;
  } catch {}
  await loadAutomationSettings();
  await loadPendingTerms();
  filtered = [...allTerms];
  const root = document.getElementById('root');
  const { data: { user } } = await supabase.auth.getUser();
  const pendingCount = pendingTerms.length;

  root.innerHTML = `
    <header class="sticky top-0 z-20 border-b bg-white/90 backdrop-blur-xl">
      <div class="mx-auto max-w-[1600px] px-6 h-[60px] flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="h-8 w-8 rounded-[10px] bg-black text-white grid place-items-center font-bold text-[12px]">IT</div>
          <div>
            <div class="font-bold text-[13px] tracking-tight">glossary 관리자 · Tier3</div>
            <div class="text-[10px] text-zinc-500 tracking-tight">${user?.email} · ${allTerms.length}개 · Pending ${pendingCount}개 · 정책 A</div>
          </div>
        </div>
        <div class="flex gap-1.5">
          <a href="./index.html" class="h-8 px-3.5 rounded-full border bg-zinc-50 grid place-items-center text-[11px] font-medium">대시보드</a>
          <button id="logoutBtn" class="h-8 px-3.5 rounded-full border bg-zinc-50 text-[11px] font-medium">로그아웃</button>
        </div>
      </div>
      <div class="mx-auto max-w-[1600px] px-6 flex gap-1.5 py-2.5 border-t bg-zinc-50/50">
        <button data-tab="crud" class="tab-btn h-7 px-3.5 rounded-full border text-[11px] font-medium ${currentTab==='crud'?'bg-black text-white border-black':'bg-white'}">CRUD (${allTerms.length})</button>
        <button data-tab="automation" class="tab-btn h-7 px-3.5 rounded-full border text-[11px] font-medium ${currentTab==='automation'?'bg-black text-white border-black':'bg-white'}">자동화 ⚙️</button>
        <button data-tab="pending" class="tab-btn h-7 px-3.5 rounded-full border text-[11px] font-medium ${currentTab==='pending'?'bg-black text-white border-black':'bg-white'}">Pending ${pendingCount>0?`🔴 ${pendingCount}`:''}</button>
      </div>
    </header>

    <main class="mx-auto max-w-[1600px] px-6 py-6">
      ${currentTab==='crud' ? renderCrudTab() : ''}
      ${currentTab==='automation' ? renderAutomationTab() : ''}
      ${currentTab==='pending' ? renderPendingTab() : ''}
    </main>
  `;

  document.getElementById('logoutBtn').onclick = async () => { await supabase.auth.signOut(); renderLogin(); };
  document.querySelectorAll('.tab-btn').forEach(b=>{
    b.onclick = ()=>{ currentTab = b.dataset.tab; renderAdmin(); };
  });

  if (currentTab==='crud') attachCrudEvents();
  if (currentTab==='automation') attachAutomationEvents();
  if (currentTab==='pending') attachPendingEvents();
}

function renderCrudTab() {
  return `
    <div class="grid lg:grid-cols-[380px_1fr] gap-6">
      <div class="space-y-4">
        <div class="rounded-[20px] border bg-white p-5">
          <div class="flex justify-between items-center">
            <h2 class="font-bold text-[15px]">${editingId ? '용어 수정' : '신규 용어 추가'}</h2>
            ${editingId ? `<button id="cancelEdit" class="text-[12px] underline text-zinc-500">취소</button>` : ''}
          </div>
          <p class="text-[11px] text-zinc-500 mt-1">id 키필드 중복 불가, category 직접 입력 허용 (Tier3 유지)</p>
          <div class="mt-4 space-y-3">
            <div><label class="text-[11px] font-bold">id *</label><input id="f-id" placeholder="예: crud" class="mt-1 w-full h-10 px-3 rounded-xl border bg-zinc-50 text-[13px] mono" ${editingId ? 'readonly' : ''} /><div id="f-id-msg" class="text-[11px] text-red-500 mt-1"></div></div>
            <div><label class="text-[11px] font-bold">term *</label><input id="f-term" class="mt-1 w-full h-10 px-3 rounded-xl border text-[13px]" /></div>
            <div><label class="text-[11px] font-bold">fullname</label><input id="f-fullname" class="mt-1 w-full h-10 px-3 rounded-xl border text-[13px]" /></div>
            <div><label class="text-[11px] font-bold">meaning *</label><textarea id="f-meaning" rows="3" class="mt-1 w-full p-3 rounded-xl border text-[13px]"></textarea></div>
            <div><label class="text-[11px] font-bold">example</label><textarea id="f-example" rows="2" class="mt-1 w-full p-3 rounded-xl border text-[13px]"></textarea></div>
            <div>
              <label class="text-[11px] font-bold">category * (직접 입력 허용)</label>
              <select id="f-category-select" class="mt-1 w-full h-10 px-3 rounded-xl border text-[13px]">
                ${CATEGORIES.map(c=>`<option value="${c}">${c}</option>`).join('')}
                <option value="__custom__">+ 직접 입력</option>
              </select>
              <input id="f-category-custom" placeholder="신규 카테고리 직접 입력" class="mt-2 w-full h-10 px-3 rounded-xl border bg-amber-50 text-[13px] hidden" />
            </div>
            <div><label class="text-[11px] font-bold">longDesc</label><textarea id="f-longdesc" rows="2" class="mt-1 w-full p-3 rounded-xl border text-[12px]"></textarea></div>
            <div><label class="text-[11px] font-bold">defaultFav</label><input id="f-defaultfav" placeholder="true 또는 비우기" class="mt-1 w-full h-10 px-3 rounded-xl border text-[13px]" /></div>
            <button id="saveBtn" class="w-full h-11 rounded-full bg-black text-white font-semibold">${editingId ? '수정 저장' : '추가'}</button>
            <div id="formMsg" class="text-[12px] min-h-[18px]"></div>
          </div>
        </div>
        <div class="rounded-[20px] border bg-white p-5">
          <h3 class="font-bold text-[13px]">백업</h3>
          <div class="mt-3 grid grid-cols-2 gap-2">
            <button id="exportAllBtn" class="h-9 rounded-full border text-[12px]">엑셀 다운로드</button>
            <button id="exportCsvBtn" class="h-9 rounded-full border text-[12px]">CSV 백업</button>
          </div>
        </div>
      </div>
      <div class="rounded-[20px] border bg-white p-5 min-w-0">
        <div class="flex justify-between items-center">
          <h2 class="font-bold">용어 목록 ${allTerms.length}개</h2>
          <input id="searchInput" placeholder="id, term 검색" class="h-10 px-4 rounded-full border bg-zinc-50 text-[13px] w-[220px]" />
        </div>
        <div class="mt-4 overflow-auto max-h-[80vh] border rounded-xl">
          <table class="w-full text-[12px]"><thead class="sticky top-0 bg-zinc-50 border-b"><tr><th class="p-2.5 text-left">id</th><th class="p-2.5 text-left">term</th><th class="p-2.5 text-left">category</th><th class="p-2.5 text-left">meaning</th><th class="p-2.5 text-right">액션</th></tr></thead><tbody id="tbody"></tbody></table>
        </div>
        <div id="tableMsg" class="mt-3 text-[11px] text-zinc-500"></div>
      </div>
    </div>
  `;
}

function renderAutomationTab() {
  const sel = automationSettings?.selected_categories || null;
  const isAutoMode = !sel || sel.length===0;
  return `
    <div class="max-w-[900px] space-y-6">
      <div class="rounded-[20px] border bg-white p-6">
        <h2 class="font-bold text-[16px]">Tier3 자동화 설정 (B. GitHub Actions + 주 1회 + 요청 시)</h2>
        <p class="text-[12px] text-zinc-500 mt-1">카테고리를 선택하면 해당 카테고리에서만 용어를 생성합니다. 아무 것도 선택하지 않으면(기본값 null) 자동 제안 모드로 동작합니다.</p>
        
        <div class="mt-6 space-y-4">
          <div>
            <label class="text-[13px] font-bold">1) 카테고리 선택 (복수 선택 가능, 비우면 자동 제안 모드)</label>
            <div class="mt-2 grid grid-cols-2 md:grid-cols-3 gap-2 p-4 border rounded-xl bg-zinc-50 max-h-[240px] overflow-auto">
              ${CATEGORIES.slice(0,13).map(c=>{
                const checked = sel ? sel.includes(c) : false;
                return `<label class="flex items-center gap-2 text-[12px]"><input type="checkbox" value="${c}" class="cat-check" ${checked?'checked':''} /> ${c}</label>`;
              }).join('')}
            </div>
            <div class="mt-2 flex gap-2">
              <input id="customCatInput" placeholder="신규 카테고리 직접 입력 (예: 블록체인)" class="flex-1 h-9 px-3 rounded-full border text-[12px]" />
              <button id="addCustomCat" class="h-9 px-4 rounded-full border bg-white text-[12px]">직접 추가</button>
            </div>
            <div id="selectedCatDisplay" class="mt-3 text-[12px] p-3 rounded-xl bg-amber-50 border border-amber-200 min-h-[40px]">
              ${isAutoMode ? '현재: <b>자동 제안 모드 (null)</b> - 시스템이 부족한 카테고리를 자동 분석하여 제안' : `현재 선택: <b>${sel.join(', ')}</b>`}
            </div>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="text-[12px] font-bold">2) 주 생성 개수</label>
              <select id="weeklyCount" class="mt-1 w-full h-10 px-3 rounded-xl border text-[13px]">
                <option value="3" ${automationSettings?.weekly_count===3?'selected':''}>3개/주 (안전)</option>
                <option value="5" ${automationSettings?.weekly_count===5?'selected':''}>5개/주 (추천)</option>
                <option value="10" ${automationSettings?.weekly_count===10?'selected':''}>10개/주 (많음)</option>
              </select>
            </div>
            <div>
              <label class="text-[12px] font-bold">3) 활성화</label>
              <select id="enabledSelect" class="mt-1 w-full h-10 px-3 rounded-xl border text-[13px]">
                <option value="true" ${automationSettings?.enabled?'selected':''}>ON - 매주 일요일 23:50 자동 실행</option>
                <option value="false" ${!automationSettings?.enabled?'selected':''}>OFF - 수동 실행만</option>
              </select>
            </div>
          </div>

          <div class="flex gap-2">
            <button id="saveAutomation" class="h-11 px-6 rounded-full bg-black text-white font-semibold text-[13px]">설정 저장 (automation_settings)</button>
            <button id="triggerNow" class="h-11 px-6 rounded-full border bg-white font-semibold text-[13px]">지금 제안 생성 (수동 트리거, STEP 3에서 연결)</button>
          </div>
          <div id="automationMsg" class="text-[12px] min-h-[20px]"></div>

          <div class="mt-6 p-4 rounded-xl bg-blue-50 border border-blue-200 text-[11px] leading-relaxed">
            <b>초보자 안내 - GitHub Actions 설정 방법 (다음 STEP 3에서 필요):</b><br/>
            1) GitHub repo > Settings > Secrets and variables > Actions > New repository secret<br/>
            &nbsp;&nbsp; - Name: SUPABASE_URL, Value: https://efklbyhqsmbieefbamen.supabase.co<br/>
            &nbsp;&nbsp; - Name: SUPABASE_SERVICE_KEY, Value: (Supabase Dashboard > Project Settings > API > service_role 키)<br/>
            2) 이 키는 프론트에 노출되면 안 되며, Actions에서만 사용됩니다.<br/>

          </div>
        </div>
      </div>

      <div class="rounded-[20px] border bg-white p-6">
        <h3 class="font-bold text-[13px]">현재 설정 요약</h3>
        <div class="mt-2 text-[12px] font-mono bg-zinc-50 p-3 rounded-xl border">
          selected_categories: ${isAutoMode ? 'null (자동 제안 모드)' : JSON.stringify(sel)}<br/>
          weekly_count: ${automationSettings?.weekly_count || 5}<br/>
          enabled: ${automationSettings?.enabled}<br/>
          last_run_at: ${automationSettings?.last_run_at || '아직 실행 안 됨'}
        </div>
      </div>
    </div>
  `;
}

function renderPendingTab() {
  const filteredPending = pendingTerms.filter(t=>{
    if (!pendingFilter) return true;
    const q = pendingFilter.toLowerCase();
    return `${t.id} ${t.term} ${t.category} ${t.meaning}`.toLowerCase().includes(q);
  });
  return `
    <div class="space-y-4">
      <div class="rounded-[20px] border bg-white p-6">
        <div class="flex justify-between items-center">
          <h2 class="font-bold text-[16px]">Pending 승인 (정책 A: 무기한 보관) - ${pendingTerms.length}개</h2>
          <input id="pendingSearch" placeholder="Pending 검색" class="h-9 px-4 rounded-full border bg-zinc-50 text-[12px] w-[200px]" value="${pendingFilter}" />
        </div>
        <p class="text-[11px] text-zinc-500 mt-2">승인하지 않으면? → <b>그대로 보관</b>됩니다. index.html에 노출 안 됨. 다음 주에 또 5개가 쌓입니다. 14일이 지나도 자동 삭제 안 됩니다. (정책 A)</p>
        
        ${pendingTerms.length===0 ? `
          <div class="mt-8 py-12 text-center border-2 border-dashed rounded-xl">
            <div class="text-[14px] font-bold">Pending이 없습니다</div>
            <div class="text-[12px] text-zinc-500 mt-1">매주 일요일 23:50에 자동 생성되거나, 자동화 설정 탭에서 "지금 제안 생성"을 눌러보세요 (STEP 3 이후 동작)</div>
          </div>
        ` : `
          <div class="mt-4 overflow-auto border rounded-xl max-h-[70vh]">
            <table class="w-full text-[12px]">
              <thead class="sticky top-0 bg-zinc-50 border-b"><tr><th class="p-2.5 text-left">id (중복 불가)</th><th class="p-2.5 text-left">term</th><th class="p-2.5 text-left">category</th><th class="p-2.5 text-left">meaning</th><th class="p-2.5 text-left">검증 출처 (2중)</th><th class="p-2.5 text-right">액션</th></tr></thead>
              <tbody>
                ${filteredPending.map(t=>{
                  const v = t.verification || {};
                  return `
                  <tr class="border-t hover:bg-zinc-50">
                    <td class="p-2.5 mono font-bold text-[11px]">${t.id}</td>
                    <td class="p-2.5 font-semibold">${t.term}</td>
                    <td class="p-2.5"><span class="px-2 py-0.5 rounded-full border text-[10px]" style="border-color:${getCategoryColor(t.category)}40">${t.category}</span></td>
                    <td class="p-2.5 max-w-[200px] truncate">${t.meaning}</td>
                    <td class="p-2.5 text-[11px]">
                      ${v.source1_url ? `<a href="${v.source1_url}" target="_blank" class="underline text-blue-600 block">출처1: ${v.source1_title||'링크'}</a>` : '<span class="text-zinc-400">출처1 없음</span>'}
                      ${v.source2_url ? `<a href="${v.source2_url}" target="_blank" class="underline text-green-600 block">출처2: ${v.source2_title||'링크'}</a>` : '<span class="text-zinc-400">출처2 없음</span>'}
                      ${v.match_score ? `<span class="text-[10px]">일치도: ${v.match_score}%</span>` : ''}
                    </td>
                    <td class="p-2.5 text-right">
                      <div class="inline-flex gap-1">
                        <button data-approve="${t.id}" class="approve-btn h-7 px-3 rounded-full bg-black text-white text-[11px]">승인</button>
                        <button data-reject="${t.id}" class="reject-btn h-7 px-3 rounded-full border bg-white text-red-600 text-[11px]">거절</button>
                      </div>
                    </td>
                  </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        `}
        <div class="mt-3 text-[11px] text-zinc-500">${filteredPending.length} / ${pendingTerms.length} 표시 · id 중복 불가 · 승인 시 terms 테이블로 이동, 거절 시 rejected 처리</div>
      </div>
    </div>
  `;
}

function attachCrudEvents() {
  const sel = document.getElementById('f-category-select');
  const customInput = document.getElementById('f-category-custom');
  sel.addEventListener('change', () => {
    if (sel.value === '__custom__') { customInput.classList.remove('hidden'); customInput.focus(); isCustomCategory = true; }
    else { customInput.classList.add('hidden'); isCustomCategory = false; }
  });
  function getCategoryValue() {
    if (sel.value === '__custom__') return customInput.value.trim();
    return sel.value;
  }
  document.getElementById('exportAllBtn').onclick = () => exportAllTerms(allTerms);
  document.getElementById('exportCsvBtn').onclick = () => {
    const csv = generateCSVFromTerms(allTerms);
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'terms.csv'; a.click();
  };
  document.getElementById('saveBtn').onclick = async () => {
    const id = document.getElementById('f-id').value.trim().toLowerCase();
    const term = document.getElementById('f-term').value.trim();
    const fullname = document.getElementById('f-fullname').value.trim();
    const meaning = document.getElementById('f-meaning').value.trim();
    const example = document.getElementById('f-example').value.trim();
    const category = getCategoryValue();
    const longDesc = document.getElementById('f-longdesc').value.trim();
    const defaultFav = document.getElementById('f-defaultfav').value.trim();
    const msgEl = document.getElementById('formMsg');
    const idMsg = document.getElementById('f-id-msg');
    if (!term || !meaning || !category) { msgEl.textContent='term, meaning, category는 필수'; msgEl.className='text-[12px] text-red-500'; return; }
    const idErr = validateId(id, !!editingId);
    if (idErr) { idMsg.textContent=idErr; return; } else idMsg.textContent='';
    const payload = { id, term, fullname, meaning, example, category, longDesc, defaultFav };
    msgEl.textContent='저장 중...';
    try {
      if (editingId) {
        const { error } = await supabase.from('terms').update(payload).eq('id', editingId);
        if (error) throw error;
        msgEl.textContent=`수정 완료: ${id}`; msgEl.className='text-[12px] text-green-600';
      } else {
        const { error } = await supabase.from('terms').insert(payload);
        if (error) throw error;
        msgEl.textContent=`추가 완료: ${id}`; msgEl.className='text-[12px] text-green-600';
      }
      const { allTerms: reloaded } = await loadTerms();
      allTerms = reloaded; filtered = [...allTerms]; renderTable();
    } catch (e) { msgEl.textContent='실패: '+e.message; msgEl.className='text-[12px] text-red-500'; }
  };
  function renderTable() {
    const tbody = document.getElementById('tbody');
    const q = searchQuery.toLowerCase();
    filtered = allTerms.filter(t => !q || `${t.id} ${t.term} ${t.meaning} ${t.category}`.toLowerCase().includes(q));
    tbody.innerHTML = filtered.map(t => `
      <tr class="border-t hover:bg-zinc-50"><td class="p-2.5 mono text-[11px] font-bold">${t.id}</td><td class="p-2.5 font-semibold">${t.term}</td><td class="p-2.5"><span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full border text-[11px]" style="border-color:${getCategoryColor(t.category)}20"><span class="h-1.5 w-1.5 rounded-full" style="background:${getCategoryColor(t.category)}"></span>${t.category}</span></td><td class="p-2.5 max-w-[260px] truncate">${t.meaning}</td><td class="p-2.5 text-right"><div class="inline-flex gap-1"><button data-edit="${t.id}" class="edit-btn h-7 px-2.5 rounded-full border bg-white text-[11px]">수정</button><button data-del="${t.id}" class="del-btn h-7 px-2.5 rounded-full border bg-red-50 text-red-600 text-[11px]">삭제</button></div></td></tr>
    `).join('');
    document.getElementById('tableMsg').textContent = `${filtered.length} / ${allTerms.length} 표시`;
    document.querySelectorAll('.edit-btn').forEach(b=>{ b.onclick = ()=>{ const t = allTerms.find(x=>x.id===b.dataset.edit); if (!t) return; editingId = t.id; document.getElementById('f-id').value=t.id; document.getElementById('f-term').value=t.term; document.getElementById('f-fullname').value=t.fullname||''; document.getElementById('f-meaning').value=t.meaning||''; document.getElementById('f-example').value=t.example||''; document.getElementById('f-longdesc').value=t.longDesc||''; document.getElementById('f-defaultfav').value=t.defaultFav||''; const selEl=document.getElementById('f-category-select'); const cust=document.getElementById('f-category-custom'); if (CATEGORIES.includes(t.category)) { selEl.value=t.category; cust.classList.add('hidden'); } else { selEl.value='__custom__'; cust.classList.remove('hidden'); cust.value=t.category; } window.scrollTo({top:0, behavior:'smooth'}); }; });
    document.querySelectorAll('.del-btn').forEach(b=>{ b.onclick = async ()=>{ if (!confirm(`삭제? ${b.dataset.del}`)) return; try { const { error } = await supabase.from('terms').delete().eq('id', b.dataset.del); if (error) throw error; allTerms = allTerms.filter(x=>x.id!==b.dataset.del); renderTable(); } catch (e) { alert('삭제 실패: '+e.message); } }; });
  }
  document.getElementById('searchInput').addEventListener('input', e=>{ searchQuery=e.target.value; renderTable(); });
  document.getElementById('f-term').addEventListener('blur', () => { const idInput=document.getElementById('f-id'); if (editingId) return; if (idInput.value) return; const term=document.getElementById('f-term').value.trim().toLowerCase(); if (!term) return; idInput.value=term.replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40); });
  renderTable();
}

function attachAutomationEvents() {
  const checks = document.querySelectorAll('.cat-check');
  const display = document.getElementById('selectedCatDisplay');
  const customInput = document.getElementById('customCatInput');
  // FIX: AX 등 잘못된 카테고리 자동 제거 (2글자 이하 대문자 약어 차단)
  let rawSelected = automationSettings?.selected_categories ? [...automationSettings.selected_categories] : [];
  // AX 삭제 로직
  let selected = rawSelected.filter(cat => {
    const trimmed = cat.trim();
    // AX, AI, ML 등 2글자 대문자 약어 차단 (단, AI·ML 같은 정식 카테고리는 CATEGORIES에 있으므로 허용)
    if (/^[A-Z]{2,3}$/.test(trimmed) && !['AI·ML'].includes(trimmed)) {
      console.log(`잘못된 카테고리 자동 제거: ${trimmed}`);
      return false;
    }
    // 1글자 차단
    if (trimmed.length < 2) return false;
    return true;
  });
  // 만약 필터링으로 AX 등이 제거되었다면 UI에 알림
  const removed = rawSelected.filter(c => !selected.includes(c));
  if (removed.length > 0) {
    console.log(`제거된 잘못된 카테고리: ${removed.join(', ')}`);
  }

  function updateDisplay() {
    if (selected.length===0) {
      display.innerHTML = '현재: <b>자동 제안 모드 (null)</b> - 시스템이 부족한 카테고리를 자동 분석하여 제안 <span class="text-[11px] text-zinc-400 ml-2">가장 부족한 카테고리를 자동 선택</span>';
    } else {
      // 각 카테고리를 X 버튼이 있는 칩으로 표시
      const chips = selected.map(cat => `
        <span class="inline-flex items-center gap-1 px-3 py-1 rounded-full bg-black text-white text-[12px] mr-1 mb-1">
          ${cat}
          <button data-remove="${cat}" class="remove-cat ml-1 w-4 h-4 rounded-full bg-white/20 hover:bg-white/30 grid place-items-center text-[10px]">✕</button>
        </span>
      `).join('');
      display.innerHTML = `
        <div class="flex flex-wrap items-center gap-1">
          <span class="text-[13px] mr-2">현재 선택:</span>
          ${chips}
          <button id="clearAllCats" class="ml-2 text-[11px] underline text-zinc-500 hover:text-black">전체 해제 (자동 모드)</button>
        </div>
        ${removed.length>0 ? `<div class="mt-2 text-[11px] text-orange-600">⚠️ 잘못된 카테고리 자동 제거됨: ${removed.join(', ')} → 저장하면 완전히 삭제됩니다</div>` : ''}
      `;
      // X 버튼 이벤트 연결
      setTimeout(()=>{
        document.querySelectorAll('.remove-cat').forEach(btn=>{
          btn.onclick = (e)=>{
            const catToRemove = e.target.getAttribute('data-remove');
            selected = selected.filter(c=>c!==catToRemove);
            // 체크박스도 해제
            checks.forEach(ch=>{ if(ch.value===catToRemove) ch.checked=false; });
            updateDisplay();
          };
        });
        const clearBtn = document.getElementById('clearAllCats');
        if (clearBtn) {
          clearBtn.onclick = ()=>{
            selected = [];
            checks.forEach(ch=>ch.checked=false);
            updateDisplay();
          };
        }
      },0);
    }
  }

  checks.forEach(ch=>{
    // 초기 체크 상태 반영
    if (selected.includes(ch.value)) ch.checked = true;
    ch.onchange = (e)=>{
      const val = e.target.value;
      if (e.target.checked) { if (!selected.includes(val)) selected.push(val); }
      else { selected = selected.filter(v=>v!==val); }
      updateDisplay();
    };
  });

  document.getElementById('addCustomCat').onclick = ()=>{
    const val = customInput.value.trim();
    if (!val) return;
    // 검증: AX 같은 2글자 대문자 약어 차단
    if (/^[A-Z]{2,3}$/.test(val)) {
      alert(`'${val}'은 너무 짧은 약어입니다. 정식 카테고리(예: AI·ML, 블록체인, 양자컴퓨팅)를 입력하세요.\n\n기존 카테고리: 데이터베이스·SQL, 개발 기본, 프론트엔드, 백엔드, AI·ML, 클라우드·DevOps, 보안, 네트워크, 데이터·분석, 모바일, 언어·프레임워크, CS 기본, Etc`);
      return;
    }
    if (val.length < 2) {
      alert('카테고리는 2글자 이상이어야 합니다.');
      return;
    }
    if (val.length > 20) {
      alert('카테고리는 20글자 이하여야 합니다.');
      return;
    }
    if (!selected.includes(val)) selected.push(val);
    customInput.value='';
    updateDisplay();
  };

  document.getElementById('saveAutomation').onclick = async ()=>{
    const weeklyCount = parseInt(document.getElementById('weeklyCount').value);
    const enabled = document.getElementById('enabledSelect').value === 'true';
    const payload = {
      selected_categories: selected.length===0 ? null : selected,
      weekly_count: weeklyCount,
      enabled,
      schedule_type: 'weekly'
    };
    const msg = document.getElementById('automationMsg');
    msg.textContent='저장 중...';
    try {
      // 기존 설정이 있으면 update, 없으면 insert
      if (automationSettings?.id) {
        const { error } = await supabase.from('automation_settings').update({ ...payload, last_run_at: automationSettings.last_run_at }).eq('id', automationSettings.id);
        if (error) throw error;
      } else {
        const { data, error } = await supabase.from('automation_settings').insert(payload).select().single();
        if (error) throw error;
        automationSettings = data;
      }
      // 로컬에도 반영
      automationSettings = { ...automationSettings, ...payload };
      msg.textContent = `저장 완료: ${selected.length===0 ? '자동 제안 모드(null)' : selected.join(', ')} / 주 ${weeklyCount}개 / ${enabled?'ON':'OFF'}`;
      msg.className='text-[12px] text-green-600';
    } catch (e) {
      msg.textContent='저장 실패: '+e.message;
      msg.className='text-[12px] text-red-500';
    }
  };

  document.getElementById('triggerNow').onclick = async ()=>{
    const msg = document.getElementById('automationMsg');
    // GitHub repo URL 추정: config에서 가져오거나, 사용자가 입력한 경우
    // 현재는 GitHub Actions 페이지로 안내하고, 직접 링크 제공
    const githubRepo = localStorage.getItem('glossary:githubRepo') || '';
    const defaultRepoUrl = 'https://github.com/YOUR_USERNAME/YOUR_REPO/actions/workflows/weekly-glossary.yml';
    
    msg.innerHTML = `
      <div class="space-y-2">
        <div>✅ STEP 3는 이미 연결되었습니다! 수동 실행 방법:</div>
        <div class="pl-4 space-y-1 text-[12px]">
          <div>1) GitHub repo → Actions 탭 → <b>Weekly Glossary Auto-Proposal (Tier3)</b> 클릭</div>
          <div>2) 오른쪽 <b>Run workflow</b> → <b>Run workflow</b> 클릭 (27초 소요)</div>
          <div>3) 완료 후 이 페이지 새로고침 → Pending 탭에 새 용어 표시</div>
        </div>
        <div class="pt-2 flex gap-2">
          <button id="openActions" class="h-8 px-4 rounded-full bg-black text-white text-[12px]">GitHub Actions 열기</button>
          <button id="copyLink" class="h-8 px-4 rounded-full border bg-white text-[12px]">링크 복사</button>
        </div>
        <div class="text-[11px] text-zinc-400">팁: 이 버튼은 GitHub API로 직접 트리거하려면 PAT가 필요합니다. 지금은 GitHub에서 직접 실행이 가장 안전합니다.</div>
      </div>
    `;
    msg.className='text-[12px] text-zinc-700 bg-zinc-50 p-3 rounded-xl border';
    
    setTimeout(()=>{
      const openBtn = document.getElementById('openActions');
      const copyBtn = document.getElementById('copyLink');
      if (openBtn) {
        openBtn.onclick = ()=>{
          // GitHub Actions 워크플로우 페이지로 이동 (사용자가 repo 주소를 알고 있다면)
          window.open('https://github.com/actions', '_blank');
          // 또는 현재 origin이 github pages라면 유추
          const currentHost = window.location.hostname;
          if (currentHost.includes('github.io')) {
            const parts = window.location.pathname.split('/').filter(Boolean);
            const repoName = parts[0] || '';
            const userName = currentHost.split('.')[0];
            const actionsUrl = `https://github.com/${userName}/${repoName}/actions`;
            window.open(actionsUrl, '_blank');
          }
        };
      }
      if (copyBtn) {
        copyBtn.onclick = async ()=>{
          try {
            await navigator.clipboard.writeText(window.location.origin + '/admin.html');
            copyBtn.textContent='복사됨!';
            setTimeout(()=>copyBtn.textContent='링크 복사',1500);
          } catch {}
        };
      }
    },0);
  };
}

function attachPendingEvents() {
  document.getElementById('pendingSearch').addEventListener('input', e=>{
    pendingFilter = e.target.value;
    const tbody = document.querySelector('table tbody');
    if (!tbody) return;
    // 간단 필터: 전체 리렌더
    renderAdmin();
    setTimeout(()=>{ const inp=document.getElementById('pendingSearch'); if (inp) { inp.focus(); inp.value=pendingFilter; inp.setSelectionRange(pendingFilter.length, pendingFilter.length); } },0);
  });

  document.querySelectorAll('.approve-btn').forEach(b=>{
    b.onclick = async ()=>{
      const id = b.dataset.approve;
      const pending = pendingTerms.find(t=>t.id===id);
      if (!pending) return;
      if (!confirm(`승인하면 terms 테이블로 이동됩니다.\n${pending.term} (${pending.id})\n계속?`)) return;
      try {
        // id 중복 체크
        const exists = allTerms.some(t=>t.id.toLowerCase()===id.toLowerCase());
        if (exists) { alert(`이미 terms에 존재하는 id입니다: ${id}. 먼저 기존 용어를 수정하거나 삭제하세요.`); return; }
        // terms에 insert
        const { error: insertErr } = await supabase.from('terms').insert({
          id: pending.id, term: pending.term, fullname: pending.fullname||'', meaning: pending.meaning,
          example: pending.example||'', category: pending.category, longDesc: pending.longDesc||'', defaultFav: pending.defaultFav||''
        });
        if (insertErr) throw insertErr;
        // pending 상태를 approved로 변경
        const { error: updateErr } = await supabase.from('terms_pending').update({ status: 'approved' }).eq('id', id);
        if (updateErr) throw updateErr;
        alert(`승인 완료: ${pending.term}`);
        renderAdmin();
      } catch (e) { alert('승인 실패: '+e.message); }
    };
  });

  document.querySelectorAll('.reject-btn').forEach(b=>{
    b.onclick = async ()=>{
      const id = b.dataset.reject;
      if (!confirm(`거절하면 rejected 상태로 보관됩니다 (정책 A: 삭제 안 됨).\n${id}`)) return;
      try {
        const { error } = await supabase.from('terms_pending').update({ status: 'rejected' }).eq('id', id);
        if (error) throw error;
        renderAdmin();
      } catch (e) { alert('거절 실패: '+e.message); }
    };
  });
}

(async () => {
  if (await checkAuth()) renderAdmin();
  else renderLogin();
  supabase.auth.onAuthStateChange((event) => { if (event==='SIGNED_OUT') renderLogin(); });
})();
</script>
