<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IT·AI 용어 사전 - glossary</title>
  <link rel="stylesheet" href="./css/app.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="importmap">{"imports":{"xlsx":"https://esm.sh/xlsx@0.18.5","@supabase/supabase-js":"https://esm.sh/@supabase/supabase-js@2.45.4"}}</script>
</head>
<body>
<div id="root" class="min-h-screen"></div>
<script type="module">
import { loadTerms } from './js/loader.js';
import { getCategoryColor, LOCAL_STORAGE_KEYS } from './js/config.js';
import { supabase } from './js/supabase.js';

let allTerms = [];
let filtered = [];
let favSet = new Set();
let searchQuery = '';
let activeCategory = '전체';
let showFavOnly = false;
let source = 'supabase';

function loadFavs() {
  try { favSet = new Set(JSON.parse(localStorage.getItem(LOCAL_STORAGE_KEYS.favorites)||'[]')); } catch { favSet = new Set(); }
}
function saveFavs() { localStorage.setItem(LOCAL_STORAGE_KEYS.favorites, JSON.stringify([...favSet])); }

function applyFilter() {
  filtered = allTerms.filter(t => {
    if (showFavOnly && !favSet.has(t.id)) return false;
    if (activeCategory !== '전체' && t.category !== activeCategory) return false;
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      const hay = `${t.term} ${t.fullname} ${t.meaning} ${t.example} ${t.longDesc} ${t.category}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function render() {
  const root = document.getElementById('root');
  const categories = ['전체', ...[...new Set(allTerms.map(t=>t.category))].sort()];
  const favCount = favSet.size;
  root.innerHTML = `
    <header class="sticky top-0 z-20 border-b bg-white/80 backdrop-blur-xl">
      <div class="mx-auto max-w-[1200px] px-6 h-[64px] flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="h-9 w-9 rounded-xl bg-black text-white grid place-items-center font-bold">IT</div>
          <div>
            <div class="font-extrabold text-[16px]">glossary</div>
            <div class="text-[11px] text-zinc-500">IT·AI 용어 사전 · ${source} · ${allTerms.length}개</div>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <span class="text-[11px] px-2.5 py-1 rounded-full border ${source==='supabase'?'bg-green-50 border-green-200 text-green-700':'bg-zinc-100'}">${source}</span>
          <a href="./admin.html" class="h-9 px-4 rounded-full border bg-zinc-50 text-[13px] grid place-items-center">관리자</a>
        </div>
      </div>
    </header>
    <div class="mx-auto max-w-[1200px] px-6 py-6 flex flex-col lg:flex-row gap-6">
      <aside class="lg:w-[240px] shrink-0 space-y-4">
        <div class="rounded-[16px] border p-3 space-y-2">
          <input id="searchInput" value="${searchQuery}" placeholder="용어, 뜻, 예시 검색" class="w-full h-10 px-4 rounded-full border bg-zinc-50 outline-none text-[14px]" />
          <div class="flex gap-2">
            <button id="favToggle" class="flex-1 h-9 rounded-full border text-[13px] ${showFavOnly?'bg-black text-white':'bg-white'}">★ ${favCount}</button>
            <button id="clearBtn" class="h-9 px-3 rounded-full border text-[13px]">초기화</button>
          </div>
        </div>
        <div class="rounded-[16px] border p-3">
          <div class="text-[12px] font-bold mb-2">카테고리</div>
          <div class="flex flex-wrap gap-1.5">
            ${categories.map(c => {
              const active = c===activeCategory;
              const color = c==='전체' ? '#111' : getCategoryColor(c);
              return `<button data-cat="${c}" class="cat-btn text-[12px] px-3 py-1.5 rounded-full border ${active?'text-white':''}" style="${active?`background:${color};border-color:${color}`:''}">${c}</button>`;
            }).join('')}
          </div>
        </div>
      </aside>
      <main class="flex-1 min-w-0">
        <div class="text-[13px] text-zinc-500 mb-3">${filtered.length}개 표시</div>
        <div class="grid md:grid-cols-2 gap-4">
          ${filtered.map(t => `
            <div class="rounded-[20px] border bg-white p-5 hover:shadow-lg transition-shadow">
              <div class="flex justify-between items-start gap-2">
                <div class="flex items-center gap-2">
                  <span class="h-2 w-2 rounded-full" style="background:${getCategoryColor(t.category)}"></span>
                  <span class="text-[11px] px-2 py-0.5 rounded-full border bg-zinc-50">${t.category}</span>
                </div>
                <button data-fav="${t.id}" class="fav-btn h-7 w-7 rounded-full border grid place-items-center text-[14px] ${favSet.has(t.id)?'bg-black text-white':''}">${favSet.has(t.id)?'★':'☆'}</button>
              </div>
              <div class="mt-3">
                <div class="font-extrabold text-[18px]">${t.term}</div>
                ${t.fullname ? `<div class="text-[12px] text-zinc-500 mono">${t.fullname}</div>` : ''}
                <div class="text-[14px] mt-2 leading-[1.6]">${t.meaning}</div>
                ${t.example ? `<div class="mt-3 text-[12px] p-3 rounded-xl bg-zinc-50 border"><span class="font-bold">예시:</span> ${t.example}</div>` : ''}
                ${t.longDesc ? `<div class="mt-2 text-[12px] text-zinc-500 line-clamp-2">${t.longDesc}</div>` : ''}
              </div>
              <div class="mt-3 flex justify-between items-center">
                <span class="text-[10px] mono text-zinc-400">${t.id}</span>
                <span class="text-[10px] text-zinc-400">${t.defaultFav ? '⭐ 기본 즐겨찾기' : ''}</span>
              </div>
            </div>
          `).join('')}
        </div>
        ${filtered.length===0 ? `<div class="py-20 text-center text-zinc-400">검색 결과 없음</div>` : ''}
      </main>
    </div>
  `;
  // events
  document.getElementById('searchInput').addEventListener('input', (e)=>{ searchQuery=e.target.value; applyFilter(); render(); document.getElementById('searchInput').focus(); const len=document.getElementById('searchInput').value.length; document.getElementById('searchInput').setSelectionRange(len,len); });
  document.getElementById('favToggle').onclick = ()=>{ showFavOnly=!showFavOnly; applyFilter(); render(); };
  document.getElementById('clearBtn').onclick = ()=>{ searchQuery=''; activeCategory='전체'; showFavOnly=false; applyFilter(); render(); };
  document.querySelectorAll('.cat-btn').forEach(b=>{ b.onclick = ()=>{ activeCategory=b.dataset.cat; applyFilter(); render(); }; });
  document.querySelectorAll('.fav-btn').forEach(b=>{ b.onclick = ()=>{ const id=b.dataset.fav; if(favSet.has(id)) favSet.delete(id); else favSet.add(id); saveFavs(); applyFilter(); render(); }; });
}

async function init() {
  loadFavs();
  const { allTerms: loaded, source: src } = await loadTerms();
  allTerms = loaded;
  source = src;
  applyFilter();
  render();
  // Realtime 구독 (선택)
  try {
    supabase.channel('terms-changes').on('postgres_changes', { event: '*', schema: 'public', table: 'terms' }, async () => {
      const { allTerms: reloaded, source: s } = await loadTerms();
      allTerms = reloaded; source = s; applyFilter(); render();
    }).subscribe();
  } catch {}
}
init();
</script>
</body>
</html>
