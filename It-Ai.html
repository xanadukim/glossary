async function dualVerify(term, draftMeaning) {
  // 1) Wikipedia
  const wikiRes = await fetch(\`https://en.wikipedia.org/api/rest_v1/page/summary/\${encodeURIComponent(term)}\`);
  const wiki = wikiRes.ok ? await wikiRes.json() : null;
  const wikiScore = wiki?.extract ? jaccardSimilarity(draftMeaning, wiki.extract) : 0.3;

  // 2) DuckDuckGo
  const duckRes = await fetch(\`https://api.duckduckgo.com/?q=\${encodeURIComponent(term)}&format=json&no_html=1\`);
  const duck = duckRes.ok ? await duckRes.json() : null;
  const duckScore = duck?.AbstractText ? jaccardSimilarity(draftMeaning, duck.AbstractText) : 0.4;

  const match_score = (wikiScore + duckScore) / 2;
  return {
    wikipedia: { exists: !!wiki, score: wikiScore, title: wiki?.title },
    duckduckgo: { score: duckScore, abstract: duck?.AbstractText?.slice(0,200) },
    match_score,
  };
}

function jaccardSimilarity(a,b) {
  const setA = new Set(a.toLowerCase().split(/\\W+/));
  const setB = new Set(b.toLowerCase().split(/\\W+/));
  const inter = [...setA].filter(x=>setB.has(x)).length;
  const union = new Set([...setA, ...setB]).size;
  return union ? inter/union : 0;
}
